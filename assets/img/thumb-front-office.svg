<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Front Office thumbnail">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#3DF07C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3DF07C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E2A36" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="720" height="360" fill="#0E141B"/>
  <rect width="720" height="360" fill="url(#grid)"/>
  <rect width="720" height="360" fill="url(#glow)"/>

  <!-- field: yard lines in perspective-free plan view -->
  <g transform="translate(40,84)">
    <rect width="380" height="200" fill="none" stroke="#2A3947" stroke-width="1.5"/>
    <g stroke="#24313F" stroke-width="1.5">
      <line x1="38" y1="0" x2="38" y2="200"/>
      <line x1="76" y1="0" x2="76" y2="200"/>
      <line x1="114" y1="0" x2="114" y2="200"/>
      <line x1="152" y1="0" x2="152" y2="200"/>
      <line x1="190" y1="0" x2="190" y2="200" stroke="#3DF07C" stroke-opacity="0.35"/>
      <line x1="228" y1="0" x2="228" y2="200"/>
      <line x1="266" y1="0" x2="266" y2="200"/>
      <line x1="304" y1="0" x2="304" y2="200"/>
      <line x1="342" y1="0" x2="342" y2="200"/>
    </g>
    <!-- play: O's and X's with a route -->
    <g fill="none" stroke="#3DF07C" stroke-width="2">
      <circle cx="120" cy="100" r="8"/>
      <circle cx="120" cy="60" r="8"/>
      <circle cx="120" cy="140" r="8"/>
      <circle cx="96" cy="100" r="8"/>
    </g>
    <g stroke="#FFB454" stroke-width="2.2">
      <path d="M 204 52 l 12 12 M 216 52 l -12 12"/>
      <path d="M 204 136 l 12 12 M 216 136 l -12 12"/>
      <path d="M 244 94 l 12 12 M 256 94 l -12 12"/>
    </g>
    <path d="M 128 60 L 200 60 Q 236 60 262 30 L 300 30" fill="none" stroke="#3DF07C" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 296 24 L 306 30 L 296 36" fill="none" stroke="#3DF07C" stroke-width="2"/>
  </g>

  <!-- analytics panel: VOR bars -->
  <g transform="translate(460,84)">
    <rect width="220" height="200" rx="6" fill="#10161E" stroke="#1E2A36" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#7C8B99" letter-spacing="1">VOR // TEAM</text>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#7C8B99">
      <text x="16" y="62">QB</text><text x="16" y="92">RB</text><text x="16" y="122">WR</text><text x="16" y="152">TE</text><text x="16" y="182">FLX</text>
    </g>
    <g>
      <rect x="52" y="52" width="120" height="12" rx="2" fill="#3DF07C" opacity="0.85"/>
      <rect x="52" y="82" width="148" height="12" rx="2" fill="#3DF07C"/>
      <rect x="52" y="112" width="96" height="12" rx="2" fill="#3DF07C" opacity="0.7"/>
      <rect x="52" y="142" width="44" height="12" rx="2" fill="#F0525F" opacity="0.85"/>
      <rect x="52" y="172" width="76" height="12" rx="2" fill="#58A6FF" opacity="0.85"/>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#3DF07C" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 22 40 L 22 22 L 40 22"/>
    <path d="M 680 22 L 698 22 L 698 40"/>
    <path d="M 698 320 L 698 338 L 680 338"/>
    <path d="M 40 338 L 22 338 L 22 320"/>
  </g>

  <!-- labels -->
  <text x="40" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" fill="#3DF07C" letter-spacing="2">&gt;_ FRONT_OFFICE</text>
  <text x="40" y="326" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7C8B99" letter-spacing="1">FANTASY FOOTBALL PLATFORM // BUILT WITH CLAUDE CODE</text>
  <text x="560" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#FFB454" letter-spacing="1">&#9679; AI-BUILT</text>
</svg>
