<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Home SIEM Lab thumbnail">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3DF07C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3DF07C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E2A36" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DF07C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3DF07C" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="720" height="360" fill="#0E141B"/>
  <rect width="720" height="360" fill="url(#grid)"/>
  <rect width="720" height="360" fill="url(#glow)"/>

  <!-- radar rings -->
  <g transform="translate(360,180)">
    <circle r="140" fill="none" stroke="#1E2A36" stroke-width="1.5"/>
    <circle r="100" fill="none" stroke="#24313F" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#2A3947" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="#3DF07C" stroke-width="1" opacity="0.5"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#1E2A36" stroke-width="1"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#1E2A36" stroke-width="1"/>

    <!-- radar sweep wedge -->
    <path d="M 0 0 L 140 0 A 140 140 0 0 0 99 -99 Z" fill="url(#sweep)" opacity="0.55"/>
    <line x1="0" y1="0" x2="140" y2="0" stroke="#3DF07C" stroke-width="2" opacity="0.9"/>

    <!-- attack blips -->
    <g fill="#3DF07C">
      <circle cx="-92" cy="-38" r="5"/>
      <circle cx="-45" cy="62" r="4"/>
      <circle cx="30" cy="-88" r="4"/>
      <circle cx="118" cy="-30" r="5"/>
      <circle cx="66" cy="44" r="3.5"/>
      <circle cx="-118" cy="18" r="3.5"/>
    </g>
    <g fill="none" stroke="#3DF07C" opacity="0.35">
      <circle cx="-92" cy="-38" r="10"/>
      <circle cx="118" cy="-30" r="10"/>
    </g>
    <!-- hot blip -->
    <circle cx="88" cy="-72" r="6" fill="#F0525F"/>
    <circle cx="88" cy="-72" r="12" fill="none" stroke="#F0525F" opacity="0.5"/>
    <circle cx="88" cy="-72" r="18" fill="none" stroke="#F0525F" opacity="0.25"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#3DF07C" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 22 40 L 22 22 L 40 22"/>
    <path d="M 680 22 L 698 22 L 698 40"/>
    <path d="M 698 320 L 698 338 L 680 338"/>
    <path d="M 40 338 L 22 338 L 22 320"/>
  </g>

  <!-- labels -->
  <text x="40" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" fill="#3DF07C" letter-spacing="2">&gt;_ SIEM_LAB</text>
  <text x="40" y="326" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7C8B99" letter-spacing="1">AZURE HONEYPOT // LIVE ATTACK TELEMETRY</text>
  <text x="560" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#F0525F" letter-spacing="1">&#9679; REC 1.1M+</text>
</svg>
